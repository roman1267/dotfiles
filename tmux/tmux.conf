unbind -a
###########
# options #
###########

# global options
set -g prefix C-a
set -g default-terminal "screen-256color"
set -g escape-time 40
set -g allow-rename off
## Window options
set -g base-index 1
## Pane options
setw -g pane-base-index 1
setw -g visual-bell on
setw -g visual-activity on

# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

############
# Keybinds #
############

# Unbinding defaults
unbind C-b
unbind x
unbind c
unbind ,
unbind :

# Prefix binds
## General binds
bind C-a send-prefix

## Pane

bind -T pane x kill-pane
bind -T pane n split-window -h
bind -T pane z resize-pane -Z
bind -T pane d break-pane
bind -T pane w run-shell "$XDG_CONFIG_HOME/tmux/scripts/popup.sh"
bind -T root C-p switch-client -T pane

## Move
bind -T move j swap-pane -D
bind -T move k swap-pane -U
bind -T root C-b switch-client -T move
## Resize

bind -r -T resize h resize-pane -L 10
bind -r -T resize j resize-pane -D 10
bind -r -T resize k resize-pane -U 10
bind -r -T resize l resize-pane -R 10
bind -T root C-n switch-client -T resize
## Window

bind -T window n new-window
bind -T window x kill-window
bind -r -T window h previous-window
bind -r -T window l next-window
bind -T window r command-prompt -I "#W" { rename-window "%%" }
bind -T window s next-layout
bind -T root C-w switch-client -T window

## Session
bind -T session l choose-tree
bind -T session e copy-mode
bind -T session : command-prompt
bind -T session r command-prompt -I "#W" { rename-session "%%" }
bind -T session d detach
bind -T root C-s switch-client -T session

## NOTE: root binds (very important!)

### Layout switching
bind -T root M-[ previous-layout
bind -T root M-] next-layout

### Quick pane/window creation
bind -T root M-n split-window -h
bind -T root M-w new-window
bind -T root M-f run-shell "$XDG_CONFIG_HOME/tmux/scripts/popup.sh"

### switch panes efficiently
bind -T root M-h select-pane -L
bind -T root M-l select-pane -R
bind -T root M-k select-pane -U
bind -T root M-j select-pane -D

### switch windows efficiently
bind -T root M-S-Left previous-window
bind -T root M-S-Right next-window

### "Locked" mode
# Cannot use any binds while in this mode
bind -T root C-g source "$XDG_CONFIG_HOME/tmux/locked.conf"
############
# Themeing #
############

set -g status-position top
set -g status-justify left
set -g status-style 'fg=#fabd2f'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=#504945 bg=#fabd2f bold'
setw -g window-status-current-format ' #I | #W '

setw -g window-status-style 'fg=#bdae93 dim'
setw -g window-status-format ' #I | #W '
setw -g window-status-bell-style 'fg=#3c3836 bg=#fb4934 bold'

# Border styles
